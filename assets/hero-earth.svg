<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="space" cx="65%" cy="48%" r="72%">
    <stop offset="0" stop-color="#073b78"/>
    <stop offset=".52" stop-color="#062858"/>
    <stop offset="1" stop-color="#031838"/>
  </radialGradient>
  <radialGradient id="earth" cx="35%" cy="30%" r="72%">
    <stop offset="0" stop-color="#2d8ed1"/>
    <stop offset=".45" stop-color="#0c5e9c"/>
    <stop offset="1" stop-color="#022c58"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8beaff" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#00b0e6" stop-opacity=".65"/>
    <stop offset="1" stop-color="#0087c0" stop-opacity=".05"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="earthClip"><circle cx="715" cy="410" r="285"/></clipPath>
</defs>
<rect width="1000" height="700" fill="url(#space)"/>
